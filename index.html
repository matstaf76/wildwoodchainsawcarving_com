<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildwood Chainsaw Carving</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .slider {
            position: relative;
            width: 80%;
            max-width: 600px;
            overflow: hidden;
        }
        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .slide {
            min-width: 100%;
            box-sizing: border-box;
        }
        .slide img {
            width: 100%;
            display: block;
        }
        @keyframes slide {
            0% { transform: translateX(0); }
            20% { transform: translateX(0); }
            25% { transform: translateX(-100%); }
            45% { transform: translateX(-100%); }
            50% { transform: translateX(-200%); }
            70% { transform: translateX(-200%); }
            75% { transform: translateX(-300%); }
            95% { transform: translateX(-300%); }
            100% { transform: translateX(0); }
        }
        .slides {
            animation: slide 20s infinite;
        }
    </style>
</head>
<body>
    <h1>Wildwood Chainsaw Carving</h1>
    <div class="slider">
        <div class="slides">
            <div class="slide"><img src="images/image1.jpg" alt="Image 1"></div>
            <div class="slide"><img src="images/image2.jpg" alt="Image 2"></div>
            <div class="slide"><img src="images/image3.jpg" alt="Image 3"></div>
            <!-- Add more images as needed -->
        </div>
    </div>
</body>
</html>
